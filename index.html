<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Inbox | Nap & Yap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#16233F; --gold:#C99A3C; --cream:#FAF5EC; --cream-dark:#F1E8D8; --terracotta:#B4694A;
    --ink:#2A2620; --ink-soft:#6B6459; --line:#E6DCC8; --white:#fff; --red:#B3261E; --green:#2E7D4F;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--cream); color:var(--ink); line-height:1.5; }
  h1,h2,h3 { font-family:'Fraunces',Georgia,serif; color:var(--navy); margin:0; }
  button { font-family:inherit; cursor:pointer; }
  .hidden { display:none !important; }

  /* login */
  #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
  .login-card { width:100%; max-width:380px; background:var(--white); border:1px solid var(--line); border-radius:28px; padding:2rem; }
  .login-card h1 { font-size:1.6rem; margin-bottom:.25rem; }
  .login-card p { color:var(--ink-soft); font-size:.9rem; margin:0 0 1.25rem; }
  label { display:block; font-size:.82rem; font-weight:600; color:var(--navy); margin:0 0 .35rem; }
  input, select, textarea { width:100%; padding:.7rem .9rem; border-radius:10px; border:1px solid var(--line); background:var(--cream); font:inherit; font-size:.95rem; color:var(--ink); }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--gold); }
  .field { margin-bottom:1rem; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.4rem; border:0; border-radius:999px; padding:.7rem 1.3rem; font-weight:600; font-size:.9rem; background:var(--gold); color:var(--navy); }
  .btn:hover { filter:brightness(.96); }
  .btn.block { width:100%; }
  .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--navy); padding:.5rem 1rem; }
  .btn.small { padding:.5rem 1rem; font-size:.82rem; }
  .btn[disabled] { opacity:.55; cursor:not-allowed; }
  .err { color:var(--red); font-size:.85rem; margin:.5rem 0 0; }
  .ok { color:var(--green); font-size:.85rem; margin:.5rem 0 0; }

  /* app */
  header.top { background:var(--navy); color:var(--cream); padding:.9rem 1.25rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  header.top h2 { color:var(--cream); font-size:1.2rem; }
  header.top .who { font-size:.82rem; opacity:.85; display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; }
  header.top .btn.ghost { color:var(--cream); border-color:rgba(255,255,255,.35); }
  main { max-width:860px; margin:0 auto; padding:1.25rem; }
  .toolbar { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin-bottom:1rem; }
  .tabs { display:flex; gap:.4rem; flex-wrap:wrap; flex:1; }
  .tab { border:1px solid var(--line); background:var(--white); color:var(--ink-soft); border-radius:999px; padding:.4rem .9rem; font-size:.85rem; font-weight:600; }
  .tab.active { background:var(--navy); color:var(--cream); border-color:var(--navy); }
  .tab .n { opacity:.7; font-weight:500; margin-left:.25rem; }
  #search { max-width:220px; padding:.5rem .8rem; border-radius:999px; }
  .note-bar { font-size:.8rem; color:var(--ink-soft); margin:0 0 1rem; }

  .card { background:var(--white); border:1px solid var(--line); border-radius:14px; margin-bottom:.75rem; overflow:hidden; }
  .card.open { border-color:var(--gold); }
  .row { width:100%; text-align:left; background:none; border:0; padding:1rem 1.1rem; display:grid; grid-template-columns:1fr auto; gap:.25rem .75rem; }
  .row .name { font-weight:700; color:var(--navy); }
  .row .meta { font-size:.85rem; color:var(--ink-soft); grid-column:1; }
  .row .ref { font-size:.75rem; color:var(--ink-soft); grid-column:2; grid-row:1; text-align:right; }
  .badge { display:inline-block; font-size:.72rem; font-weight:700; letter-spacing:.03em; text-transform:uppercase; padding:.15rem .6rem; border-radius:999px; background:var(--cream-dark); color:var(--navy); }
  .badge.new { background:var(--gold); color:var(--navy); }
  .badge.checking_availability { background:#DCE6F5; color:#1B3A6B; }
  .badge.replied { background:#DDEFE3; color:var(--green); }
  .badge.rejected { background:#F6DEDB; color:var(--red); }
  .row .badge { grid-column:2; grid-row:2; justify-self:end; }

  .detail { border-top:1px solid var(--line); padding:1rem 1.1rem 1.25rem; background:#FFFDF9; }
  .grid2 { display:grid; grid-template-columns:1fr; gap:.75rem 1.5rem; margin-bottom:1rem; }
  @media (min-width:600px) { .grid2 { grid-template-columns:1fr 1fr; } }
  .kv .k { font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600; }
  .kv .v { font-size:.95rem; word-break:break-word; white-space:pre-wrap; }
  .kv a { color:var(--navy); }
  .section { margin-top:1.1rem; padding-top:1rem; border-top:1px dashed var(--line); }
  .section h3 { font-size:1rem; margin-bottom:.5rem; }
  .actions { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
  .actions select { width:auto; min-width:200px; }
  .avail-item { font-size:.88rem; padding:.45rem .7rem; border-radius:8px; margin-top:.4rem; background:var(--cream-dark); }
  .avail-item.conflict { background:#F6DEDB; color:#7A1B15; }
  .avail-ok { font-size:.9rem; color:var(--green); font-weight:600; margin-top:.4rem; }
  .hist { list-style:none; margin:0; padding:0; font-size:.85rem; color:var(--ink-soft); }
  .hist li { padding:.3rem 0; border-bottom:1px solid var(--line); }
  .empty { text-align:center; color:var(--ink-soft); padding:2.5rem 1rem; }
  .small-print { font-size:.78rem; color:var(--ink-soft); margin:.4rem 0 0; }
  /* chats */
  .dot { display:inline-block; min-width:1.1rem; padding:0 .35rem; border-radius:999px; background:var(--red); color:#fff; font-size:.7rem; font-weight:700; margin-left:.4rem; text-align:center; }
  .thread { max-height:340px; overflow-y:auto; background:var(--cream); border:1px solid var(--line); border-radius:12px; padding:.75rem; display:flex; flex-direction:column; gap:.5rem; }
  .bubble { max-width:85%; padding:.5rem .75rem; border-radius:14px; font-size:.92rem; white-space:pre-wrap; word-break:break-word; }
  .bubble.guest { align-self:flex-start; background:var(--white); border:1px solid var(--line); }
  .bubble.owner { align-self:flex-end; background:var(--navy); color:var(--cream); }
  .bubble .who { display:block; font-size:.7rem; opacity:.7; margin-bottom:.1rem; }
  /* calendar */
  .cal-head { display:flex; align-items:center; gap:.5rem; margin-bottom:.75rem; flex-wrap:wrap; }
  .cal-head h3 { flex:1; min-width:140px; text-align:center; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-dow { font-size:.7rem; text-transform:uppercase; color:var(--ink-soft); font-weight:600; text-align:center; padding:.2rem 0; }
  .cal-cell { min-height:84px; background:var(--white); border:1px solid var(--line); border-radius:8px; padding:.25rem; cursor:pointer; overflow:hidden; display:flex; flex-direction:column; gap:2px; text-align:left; font:inherit; color:inherit; }
  .cal-cell.blank { background:transparent; border-color:transparent; cursor:default; }
  .cal-cell.today { border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold); }
  .cal-cell.sel { background:#FFFDF9; border-color:var(--navy); }
  .cal-cell .dn { font-size:.72rem; color:var(--ink-soft); font-weight:600; }
  .pill { font-size:.68rem; line-height:1.25; padding:1px 4px; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  .p-conf { background:var(--navy); color:var(--cream); }
  .p-pend { background:#F3E3BE; color:#6B4E0E; border:1px solid var(--gold); }
  .p-done { background:var(--cream-dark); color:var(--ink-soft); }
  .p-hold { background:#F2D9CE; color:#7A3A1F; border:1px dashed var(--terracotta); }
  .p-block { background:repeating-linear-gradient(45deg,#E4E0D6,#E4E0D6 4px,#F1EEE6 4px,#F1EEE6 8px); color:var(--ink-soft); }
  .cal-more { font-size:.66rem; color:var(--ink-soft); }
  .legend { display:flex; gap:.5rem; flex-wrap:wrap; margin:.75rem 0; font-size:.75rem; }
  .legend .pill { display:inline-block; padding:2px 8px; }
  .day-item { display:grid; grid-template-columns:auto 1fr; gap:.25rem .75rem; align-items:start; padding:.5rem 0; border-bottom:1px solid var(--line); font-size:.9rem; }
  @media (max-width:600px) { .cal-cell { min-height:64px; } .cal-cell .pill { font-size:0; height:6px; padding:0; } }
</style>
</head>
<body>

<section id="login">
  <form class="login-card" id="loginForm">
    <h1>Nap & Yap</h1>
    <p>Owners' inbox. Please sign in with your own login.</p>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button class="btn block" id="loginBtn" type="submit">Sign in</button>
    <p class="err hidden" id="loginErr"></p>
  </form>
</section>

<section id="app" class="hidden">
  <header class="top">
    <h2 id="pageTitle">Inquiry inbox</h2>
    <div class="who"><span id="whoami"></span><button class="btn ghost small" id="refreshBtn" type="button">Refresh</button><button class="btn ghost small" id="logoutBtn" type="button">Sign out</button></div>
  </header>
  <main>
    <div class="tabs" id="views" style="margin-bottom:1rem"></div>
    <div id="inqView">
      <div class="toolbar">
        <div class="tabs" id="tabs"></div>
        <input id="search" type="search" placeholder="Search name, phone, ref">
      </div>
      <p class="note-bar" id="noteBar"></p>
      <div id="list"></div>
    </div>
    <div id="chatView" class="hidden"></div>
    <div id="calView" class="hidden"></div>
  </main>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// PRODUCTION project. The key is the public one; data is protected by database rules.
var SUPABASE_URL = 'https://skczajswyzkkvgmwzdmi.supabase.co';
var SUPABASE_KEY = 'sb_publishable__roWQSn4T5xc8Kq09lqB7w_MCXYac6b';

(function () {
  var db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var STATUS_LABEL = {
    'new': 'New', 'checking_availability': 'Checking availability', 'replied': 'Replied',
    'converted': 'Converted', 'rejected': 'Rejected', 'closed': 'Closed'
  };
  var OPEN_SET = ['new', 'checking_availability', 'replied'];
  var PICKABLE = ['new', 'checking_availability', 'replied', 'rejected', 'closed']; // 'converted' is set by the conversion flow later

  var state = { me: null, rows: [], names: {}, tab: 'open', q: '', openId: null, view: 'inq', convMsg: null };

  function $(id) { return document.getElementById(id); }
  function h(tag, props, kids) {
    var el = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === 'class') el.className = props[k];
      else if (k === 'text') el.textContent = props[k];
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), props[k]);
      else el.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  // All guest-supplied text goes in through textContent, never innerHTML.

  var fmtDate = new Intl.DateTimeFormat('en-PH', { timeZone: 'Asia/Manila', weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  var fmtStamp = new Intl.DateTimeFormat('en-PH', { timeZone: 'Asia/Manila', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  function dateOnly(s) { return fmtDate.format(new Date(s + 'T00:00:00+08:00')); }
  function nights(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }

  // ---------------------------------------------------------------- auth ----
  $('loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var err = $('loginErr'); err.classList.add('hidden');
    $('loginBtn').disabled = true;
    db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value })
      .then(function (r) {
        $('loginBtn').disabled = false;
        if (r.error) { err.textContent = 'Sign-in failed: ' + r.error.message; err.classList.remove('hidden'); return; }
        $('password').value = '';
        start();
      });
  });
  $('logoutBtn').addEventListener('click', function () {
    db.auth.signOut().then(function () { location.reload(); });
  });
  $('refreshBtn').addEventListener('click', function () { load(); loadChats(); if (state.view === 'cal') loadCal(); });

  function start() {
    db.auth.getUser().then(function (r) {
      if (!r.data || !r.data.user) return showLogin();
      var uid = r.data.user.id;
      db.from('profiles').select('id, full_name, role, is_active').eq('id', uid).single().then(function (p) {
        if (p.error || !p.data || p.data.role !== 'owner' || !p.data.is_active) {
          var why = p.error ? ' (' + p.error.message + ')'
            : !p.data ? ' (no profile found)'
            : ' (role: ' + p.data.role + ', active: ' + p.data.is_active + ')';
          db.auth.signOut().then(function () {
            showLogin('This login does not have access to the inbox.' + why);
          });
          return;
        }
        state.me = p.data;
        $('whoami').textContent = (p.data.full_name || r.data.user.email) + ' (owner)';
        $('login').classList.add('hidden');
        $('app').classList.remove('hidden');
        load();
        setView('inq');
        loadChats();
        startRealtime();
      });
    });
  }
  function showLogin(msg) {
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
    if (msg) { $('loginErr').textContent = msg; $('loginErr').classList.remove('hidden'); }
  }

  // ---------------------------------------------------------------- data ----
  function load() {
    $('noteBar').textContent = 'Loading...';
    var dirtyNotes = readOpenNotes();
    Promise.all([
      db.from('inquiries').select('*').is('deleted_at', null).order('received_at', { ascending: false }).limit(500),
      db.from('profiles').select('id, full_name')
    ]).then(function (res) {
      if (res[0].error) { $('noteBar').textContent = ''; $('list').replaceChildren(h('p', { class: 'err', text: 'Could not load inquiries: ' + res[0].error.message })); return; }
      state.rows = res[0].data || [];
      state.names = {};
      (res[1].data || []).forEach(function (p) { state.names[p.id] = p.full_name || 'Owner'; });
      $('noteBar').textContent = 'Updated ' + fmtStamp.format(new Date()) + '. Times shown in Philippine time.';
      render(dirtyNotes);
    });
  }
  function readOpenNotes() {
    var ta = document.getElementById('notes-' + state.openId);
    return ta ? { id: state.openId, value: ta.value } : null;
  }

  // -------------------------------------------------------------- render ----
  function matches(r) {
    if (state.tab === 'open' && OPEN_SET.indexOf(r.status) < 0) return false;
    if (state.tab === 'done' && OPEN_SET.indexOf(r.status) >= 0) return false;
    if (state.q) {
      var hay = [r.guest_name, r.phone, r.email, r.reference].join(' ').toLowerCase();
      if (hay.indexOf(state.q) < 0) return false;
    }
    return true;
  }
  function renderTabs() {
    var open = state.rows.filter(function (r) { return OPEN_SET.indexOf(r.status) >= 0; }).length;
    var tabs = [['open', 'Open', open], ['done', 'Done', state.rows.length - open], ['all', 'All', state.rows.length]];
    $('tabs').replaceChildren.apply($('tabs'), tabs.map(function (t) {
      return h('button', { class: 'tab' + (state.tab === t[0] ? ' active' : ''), type: 'button', onclick: function () { state.tab = t[0]; render(); } },
        [t[1], h('span', { class: 'n', text: String(t[2]) })]);
    }));
  }
  function render(keepNotes) {
    renderTabs();
    var rows = state.rows.filter(matches);
    var list = $('list');
    if (!rows.length) {
      list.replaceChildren(h('div', { class: 'empty', text: state.rows.length ? 'Nothing here.' : 'No inquiries yet.' }));
      return;
    }
    list.replaceChildren.apply(list, rows.map(function (r) { return card(r, keepNotes); }));
  }
  function card(r, keepNotes) {
    var isOpen = state.openId === r.id;
    var meta = dateOnly(r.requested_check_in) + ' to ' + dateOnly(r.requested_check_out) +
      ' · ' + nights(r.requested_check_in, r.requested_check_out) + ' night(s) · ' + r.guest_count + ' guest(s)';
    var row = h('button', { class: 'row', type: 'button', onclick: function () {
      state.openId = isOpen ? null : r.id; state.convMsg = null; render();
    } }, [
      h('span', { class: 'name', text: r.guest_name }),
      h('span', { class: 'ref', text: r.reference + ' · ' + fmtStamp.format(new Date(r.received_at)) }),
      h('span', { class: 'meta', text: meta }),
      h('span', { class: 'badge ' + r.status, text: STATUS_LABEL[r.status] || r.status })
    ]);
    var el = h('div', { class: 'card' + (isOpen ? ' open' : '') }, [row]);
    if (isOpen) el.appendChild(detail(r, keepNotes));
    return el;
  }
  function kv(k, vNode) { return h('div', { class: 'kv' }, [h('div', { class: 'k', text: k }), h('div', { class: 'v' }, [vNode])]); }
  function plain(t) { return document.createTextNode(t || 'Not given'); }

  function detail(r, keepNotes) {
    var phone = r.phone && /^[0-9+()\-\s]{7,50}$/.test(r.phone) ? h('a', { href: 'tel:' + r.phone.replace(/[^0-9+]/g, ''), text: r.phone }) : plain(r.phone);
    var email = r.email && /^[^\s@?&#]+@[^\s@?&#]+\.[^\s@?&#]+$/.test(r.email) ? h('a', { href: 'mailto:' + r.email, text: r.email }) : plain(r.email);

    var d = h('div', { class: 'detail' }, [
      h('div', { class: 'grid2' }, [
        kv('Phone', phone), kv('Email', email),
        kv('Check-in', plain(dateOnly(r.requested_check_in))), kv('Check-out', plain(dateOnly(r.requested_check_out))),
        kv('Guests', plain(String(r.guest_count))), kv('Occasion', plain(r.occasion)),
        kv('Source', plain(r.source)), kv('Received', plain(fmtStamp.format(new Date(r.received_at))))
      ]),
      kv('Guest notes', plain(r.special_requests))
    ]);

    // availability
    var availBox = h('div', { id: 'avail-' + r.id });
    d.appendChild(h('div', { class: 'section' }, [
      h('h3', { text: 'Are these dates free?' }),
      h('button', { class: 'btn small', type: 'button', text: 'Check availability', onclick: function () { checkAvail(r, availBox); } }),
      availBox,
      h('p', { class: 'small-print', text: 'This only checks the calendar. It does not hold or reserve the dates.' })
    ]));

    // reservation (draft only; never confirms, never sends anything)
    var convKids = [h('h3', { text: 'Reservation' })];
    if (r.status === 'converted') {
      convKids.push(h('p', { class: 'small-print', text: 'This inquiry already has a reservation. You can see it on the Calendar tab.' }));
      var reopenBtn = h('button', { class: 'btn small', type: 'button', text: 'Reopen inquiry' });
      reopenBtn.addEventListener('click', function () { reopenInquiry(r, reopenBtn); });
      convKids.push(reopenBtn);
      convKids.push(h('p', { class: 'small-print', text: 'Only works if the reservation was cancelled first. It moves this inquiry back to Checking availability so you can make a new draft. Nothing is sent to the guest.' }));
    } else if (OPEN_SET.indexOf(r.status) >= 0) {
      var convBtn = h('button', { class: 'btn small', type: 'button', text: 'Create reservation (draft)' });
      convBtn.addEventListener('click', function () { convertInquiry(r, convBtn); });
      convKids.push(convBtn);
      convKids.push(h('p', { class: 'small-print', text: 'This makes a quotation draft, not a confirmed booking. It does not hold the dates, and nothing is sent to the guest. Confirming is a separate step.' }));
    }
    if (state.convMsg && state.convMsg.id === r.id) convKids.push(h('p', { class: state.convMsg.good ? 'ok' : 'err', text: state.convMsg.t }));
    if (convKids.length > 1) d.appendChild(h('div', { class: 'section' }, convKids));

    // status
    var sel = h('select', { id: 'status-' + r.id }, PICKABLE.map(function (s) {
      var o = h('option', { value: s, text: STATUS_LABEL[s] }); if (s === r.status) o.selected = true; return o;
    }));
    if (PICKABLE.indexOf(r.status) < 0) { // converted: shown but not changeable here
      var o = h('option', { value: r.status, text: STATUS_LABEL[r.status] }); o.selected = true; sel.appendChild(o); sel.disabled = true;
    }
    var stMsg = h('p', { class: 'hidden' });
    d.appendChild(h('div', { class: 'section' }, [
      h('h3', { text: 'Status' }),
      h('div', { class: 'actions' }, [
        sel,
        h('button', { class: 'btn small', type: 'button', text: 'Save status', onclick: function () { saveStatus(r, sel, stMsg); } })
      ]),
      stMsg,
      h('p', { class: 'small-print', text: 'Marking an inquiry as replied does not send anything to the guest. Reply to them yourself, then update the status.' })
    ]));

    // notes
    var ta = h('textarea', { id: 'notes-' + r.id, rows: '4', placeholder: 'Private notes for the owners. Guests never see this.' });
    ta.value = keepNotes && keepNotes.id === r.id ? keepNotes.value : (r.internal_notes || '');
    var nMsg = h('p', { class: 'hidden' });
    d.appendChild(h('div', { class: 'section' }, [
      h('h3', { text: 'Internal notes' }), ta,
      h('div', { class: 'actions', style: 'margin-top:.5rem' }, [
        h('button', { class: 'btn small', type: 'button', text: 'Save notes', onclick: function () { saveNotes(r, ta, nMsg); } })
      ]), nMsg
    ]));

    // history
    var histBox = h('ul', { class: 'hist' }, [h('li', { text: 'Loading...' })]);
    d.appendChild(h('div', { class: 'section' }, [h('h3', { text: 'History' }), histBox]));
    loadHistory(r.id, histBox);
    return d;
  }

  function setMsg(el, text, good) { el.className = good ? 'ok' : 'err'; el.textContent = text; }

  function convertInquiry(r, btn) {
    var msg = 'Create a reservation draft for ' + r.guest_name + '?\n\n' +
      dateOnly(r.requested_check_in) + ' to ' + dateOnly(r.requested_check_out) + ', ' + r.guest_count + ' guest(s).\n\n' +
      'It starts as a quotation draft. It is NOT a confirmed booking, it does not hold the dates, and nothing is sent to the guest.';
    if (!confirm(msg)) return;
    btn.disabled = true;
    db.rpc('create_reservation_from_inquiry', { p_inquiry_id: r.id }).then(function (res) {
      if (res.error) {
        state.convMsg = { id: r.id, t: 'Could not create the reservation. ' + res.error.message, good: false };
        render(readOpenNotes());
        return;
      }
      var ref = res.data && res.data.reference ? res.data.reference + ' ' : '';
      state.convMsg = { id: r.id, t: 'Reservation draft ' + ref + 'created. It is a quotation draft, not a booking. Nothing was sent to the guest.', good: true };
      cal.loaded = false;
      state.tab = 'all'; // the inquiry leaves the Open list once converted; keep it visible so the message can be read
      load();
    });
  }

  function reopenInquiry(r, btn) {
    if (!confirm('Reopen the inquiry for ' + r.guest_name + '?\n\nIt goes back to Checking availability. The cancelled reservation stays in the history. Nothing is sent to the guest.')) return;
    var note = prompt('Optional note (why you are reopening it):', '');
    if (note === null) return;
    btn.disabled = true;
    db.rpc('reopen_inquiry', { p_inquiry_id: r.id, p_note: note.trim() || null }).then(function (res) {
      if (res.error) {
        state.convMsg = { id: r.id, t: 'Could not reopen. ' + res.error.message, good: false };
        render(readOpenNotes());
        return;
      }
      state.convMsg = { id: r.id, t: 'Inquiry reopened. Nothing was sent to the guest.', good: true };
      cal.loaded = false;
      state.tab = 'all';
      load();
    });
  }

  function patchRow(updated) {
    for (var i = 0; i < state.rows.length; i++) if (state.rows[i].id === updated.id) state.rows[i] = updated;
  }
  function saveStatus(r, sel, msg) {
    if (sel.value === r.status) return setMsg(msg, 'Status is already ' + STATUS_LABEL[r.status] + '.', true);
    if ((sel.value === 'rejected' || sel.value === 'closed') && !confirm('Mark this inquiry as ' + STATUS_LABEL[sel.value] + '?')) return;
    db.from('inquiries').update({ status: sel.value }).eq('id', r.id).select().single().then(function (res) {
      if (res.error || !res.data) return setMsg(msg, 'Could not save. ' + (res.error ? res.error.message : 'Not allowed.'), false);
      patchRow(res.data); render(readOpenNotes());
      var m = document.getElementById('status-' + r.id); if (m) setMsg(m.parentNode.parentNode.querySelector('p.hidden, p.ok, p.err'), 'Saved.', true);
    });
  }
  function saveNotes(r, ta, msg) {
    db.from('inquiries').update({ internal_notes: ta.value.trim() || null }).eq('id', r.id).select().single().then(function (res) {
      if (res.error || !res.data) return setMsg(msg, 'Could not save. ' + (res.error ? res.error.message : 'Not allowed.'), false);
      patchRow(res.data); setMsg(msg, 'Saved.', true);
      var box = document.querySelector('.card.open .hist'); if (box) loadHistory(r.id, box);
    });
  }

  function checkAvail(r, box) {
    box.replaceChildren(h('p', { class: 'small-print', text: 'Checking...' }));
    db.rpc('check_availability', { p_property_id: r.property_id, p_check_in: r.requested_check_in, p_check_out: r.requested_check_out, p_exclude_reservation: null, p_exclude_inquiry: r.id })
      .then(function (res) {
        if (res.error) return box.replaceChildren(h('p', { class: 'err', text: 'Could not check: ' + res.error.message }));
        var items = res.data || [];
        if (!items.length) return box.replaceChildren(h('p', { class: 'avail-ok', text: 'No bookings, holds or blocked dates overlap these dates.' }));
        box.replaceChildren.apply(box, items.map(function (it) {
          var kind = it.kind === 'reservation' ? 'Reservation' : it.kind === 'hold' ? 'Hold' : 'Blocked';
          var txt = kind + (it.severity === 'conflict' ? ' (conflict)' : ' (warning)') + ': ' + (it.label || '') + ', ' + it.check_in + ' to ' + it.check_out + ' [' + it.status + ']';
          return h('div', { class: 'avail-item' + (it.severity === 'conflict' ? ' conflict' : ''), text: txt });
        }));
      });
  }

  function loadHistory(id, box) {
    db.from('activity_logs').select('*').eq('entity_type', 'inquiry').eq('entity_id', id).order('created_at', { ascending: false }).limit(50)
      .then(function (res) {
        if (res.error) return box.replaceChildren(h('li', { text: 'Could not load history.' }));
        var rows = res.data || [];
        if (!rows.length) return box.replaceChildren(h('li', { text: 'No changes yet.' }));
        box.replaceChildren.apply(box, rows.map(function (a) {
          var who = state.names[a.actor_id] || 'Unknown';
          var parts = [];
          var dts = a.details || {};
          if (dts.status) parts.push('status ' + (STATUS_LABEL[dts.status.from] || dts.status.from) + ' to ' + (STATUS_LABEL[dts.status.to] || dts.status.to));
          if (dts.internal_notes_changed) parts.push('notes edited');
          if (dts.assigned_to) parts.push('assignee changed');
          return h('li', { text: fmtStamp.format(new Date(a.created_at)) + ': ' + who + ' changed ' + (parts.join(', ') || 'this inquiry') });
        }));
      });
  }

  // ---------------------------------------------------------------- chats ----
  var chat = { rows: [], tab: 'open', openId: null, msgs: {}, err: null, channel: null, timer: null };

  function isUnread(c) {
    return !!c.last_guest_message_at && (!c.owner_last_read_at || Date.parse(c.owner_last_read_at) < Date.parse(c.last_guest_message_at));
  }
  function unreadCount() { return chat.rows.filter(isUnread).length; }

  function renderViews() {
    var n = unreadCount();
    var defs = [['inq', 'Inquiries', 0], ['chats', 'Chats', n], ['cal', 'Calendar', 0]];
    $('views').replaceChildren.apply($('views'), defs.map(function (t) {
      var kids = [t[1]];
      if (t[2]) kids.push(h('span', { class: 'dot', text: String(t[2]) }));
      return h('button', { class: 'tab' + (state.view === t[0] ? ' active' : ''), type: 'button', onclick: function () { setView(t[0]); } }, kids);
    }));
    document.title = (n ? '(' + n + ') ' : '') + 'Inbox | Nap & Yap';
  }
  function setView(v) {
    state.view = v;
    $('inqView').classList.toggle('hidden', v !== 'inq');
    $('chatView').classList.toggle('hidden', v !== 'chats');
    $('calView').classList.toggle('hidden', v !== 'cal');
    $('pageTitle').textContent = v === 'chats' ? 'Guest chats' : v === 'cal' ? 'Calendar' : 'Inquiry inbox';
    renderViews();
    if (v === 'chats') { renderChats(); if (chat.openId) loadMessages(chat.openId); }
    if (v === 'cal') { if (cal.loaded) renderCal(); else loadCal(); }
  }
  function readDraft() {
    var ta = chat.openId ? document.getElementById('reply-' + chat.openId) : null;
    return ta ? { id: chat.openId, value: ta.value } : null;
  }
  // do not rebuild the screen while an owner is typing a reply
  function refreshChats() {
    var a = document.activeElement;
    if (a && a.id && a.id.indexOf('reply-') === 0) return;
    renderChats(readDraft());
  }
  function patchChat(updated) {
    for (var i = 0; i < chat.rows.length; i++) if (chat.rows[i].id === updated.id) chat.rows[i] = updated;
  }

  function loadChats() {
    Promise.all([
      db.from('chat_conversations').select('*').order('last_message_at', { ascending: false }).limit(200),
      db.from('profiles').select('id, full_name')
    ]).then(function (res) {
      if (res[0].error) { chat.err = res[0].error.message; if (state.view === 'chats') refreshChats(); return; }
      chat.err = null;
      chat.rows = res[0].data || [];
      (res[1].data || []).forEach(function (p) { state.names[p.id] = p.full_name || 'Owner'; });
      renderViews();
      if (state.view === 'chats') { refreshChats(); if (chat.openId) loadMessages(chat.openId); }
    });
  }

  function renderChats(keep) {
    var box = $('chatView');
    var open = chat.rows.filter(function (c) { return c.status === 'open'; }).length;
    var tabs = [['open', 'Open', open], ['closed', 'Closed', chat.rows.length - open], ['all', 'All', chat.rows.length]];
    var tabBar = h('div', { class: 'toolbar' }, [h('div', { class: 'tabs' }, tabs.map(function (t) {
      return h('button', { class: 'tab' + (chat.tab === t[0] ? ' active' : ''), type: 'button', onclick: function () { chat.tab = t[0]; renderChats(readDraft()); } },
        [t[1], h('span', { class: 'n', text: String(t[2]) })]);
    }))]);
    var rows = chat.rows.filter(function (c) { return chat.tab === 'all' || c.status === chat.tab; });
    var kids = [tabBar];
    if (chat.err) kids.push(h('p', { class: 'err', text: 'Could not load chats: ' + chat.err }));
    else if (!rows.length) kids.push(h('div', { class: 'empty', text: chat.rows.length ? 'Nothing here.' : 'No chats yet.' }));
    else rows.forEach(function (c) { kids.push(chatCard(c, keep)); });
    box.replaceChildren.apply(box, kids);
    if (chat.openId) paintMessages(chat.openId);
  }

  function chatCard(c, keep) {
    var isOpen = chat.openId === c.id;
    var unread = isUnread(c);
    var row = h('button', { class: 'row', type: 'button', onclick: function () {
      chat.openId = isOpen ? null : c.id;
      renderChats();
      if (chat.openId) loadMessages(chat.openId);
    } }, [
      h('span', { class: 'name', text: c.guest_name }),
      h('span', { class: 'ref', text: 'Last message ' + fmtStamp.format(new Date(c.last_message_at)) }),
      h('span', { class: 'meta', text: c.phone || c.email || '' }),
      h('span', { class: 'badge' + (unread ? ' new' : ''), text: unread ? 'New message' : (c.status === 'open' ? 'Open' : 'Closed') })
    ]);
    var el = h('div', { class: 'card' + (isOpen ? ' open' : '') }, [row]);
    if (isOpen) el.appendChild(chatDetail(c, keep));
    return el;
  }

  function chatDetail(c, keep) {
    var phone = c.phone && /^[0-9+()\-\s]{7,50}$/.test(c.phone) ? h('a', { href: 'tel:' + c.phone.replace(/[^0-9+]/g, ''), text: c.phone }) : plain(c.phone);
    var email = c.email && /^[^\s@?&#]+@[^\s@?&#]+\.[^\s@?&#]+$/.test(c.email) ? h('a', { href: 'mailto:' + c.email, text: c.email }) : plain(c.email);
    var thread = h('div', { class: 'thread', id: 'msgs-' + c.id });
    var ta = h('textarea', { id: 'reply-' + c.id, rows: '3', maxlength: '2000', placeholder: 'Type your reply to the guest' });
    if (keep && keep.id === c.id) ta.value = keep.value;
    var msg = h('p', { class: 'hidden' });
    var sendBtn = h('button', { class: 'btn small', type: 'button', text: 'Send reply' });
    sendBtn.addEventListener('click', function () { sendReply(c, ta, msg, sendBtn); });
    var isOpenChat = c.status === 'open';
    return h('div', { class: 'detail' }, [
      h('div', { class: 'grid2' }, [
        kv('Phone', phone), kv('Email', email),
        kv('Chat started', plain(fmtStamp.format(new Date(c.created_at)))), kv('Status', plain(isOpenChat ? 'Open' : 'Closed'))
      ]),
      h('div', { class: 'section' }, [h('h3', { text: 'Messages' }), thread]),
      h('div', { class: 'section' }, [
        ta,
        h('div', { class: 'actions', style: 'margin-top:.5rem' }, [
          sendBtn,
          h('button', { class: 'btn ghost small', type: 'button', text: isOpenChat ? 'Close chat' : 'Reopen chat', onclick: function () { setChatStatus(c, isOpenChat ? 'closed' : 'open'); } })
        ]),
        msg,
        h('p', { class: 'small-print', text: 'Guests see your reply in the chat window on the website. They get no email or text. A chat is not a booking.' })
      ])
    ]);
  }

  function paintMessages(id) {
    var box = document.getElementById('msgs-' + id);
    if (!box) return;
    var list = chat.msgs[id];
    if (!list) { box.replaceChildren(h('p', { class: 'small-print', text: 'Loading...' })); return; }
    if (!list.length) { box.replaceChildren(h('p', { class: 'small-print', text: 'No messages.' })); return; }
    box.replaceChildren.apply(box, list.map(function (m) {
      var who = m.sender === 'guest' ? 'Guest' : (state.names[m.sender_profile_id] || 'Owner');
      return h('div', { class: 'bubble ' + (m.sender === 'guest' ? 'guest' : 'owner') }, [
        h('span', { class: 'who', text: who + ' · ' + fmtStamp.format(new Date(m.created_at)) }),
        document.createTextNode(m.body)
      ]);
    }));
    box.scrollTop = box.scrollHeight;
  }

  function loadMessages(id) {
    db.from('chat_messages').select('id, sender, sender_profile_id, body, created_at').eq('conversation_id', id).order('created_at', { ascending: true }).limit(500)
      .then(function (res) {
        if (res.error) {
          var b = document.getElementById('msgs-' + id);
          if (b) b.replaceChildren(h('p', { class: 'err', text: 'Could not load messages: ' + res.error.message }));
          return;
        }
        chat.msgs[id] = res.data || [];
        paintMessages(id);
        var c = chat.rows.filter(function (x) { return x.id === id; })[0];
        if (c && isUnread(c) && state.view === 'chats' && chat.openId === id && !document.hidden) markRead(c);
      });
  }

  // read time is set to the guest message's own server time, so clocks cannot disagree
  function markRead(c) {
    db.from('chat_conversations').update({ owner_last_read_at: c.last_guest_message_at }).eq('id', c.id).select().single().then(function (res) {
      if (res.error || !res.data) return;
      patchChat(res.data);
      renderViews();
      if (state.view === 'chats') refreshChats();
    });
  }

  function sendReply(c, ta, msg, btn) {
    var body = ta.value.trim();
    if (!body) return setMsg(msg, 'Type a message first.', false);
    if (body.length > 2000) return setMsg(msg, 'Please keep it under 2000 characters.', false);
    btn.disabled = true;
    db.from('chat_messages').insert({ conversation_id: c.id, sender: 'owner', sender_profile_id: state.me.id, body: body })
      .select('id, sender, sender_profile_id, body, created_at').single().then(function (res) {
        btn.disabled = false;
        if (res.error || !res.data) return setMsg(msg, 'Not sent. ' + (res.error ? res.error.message : 'Not allowed.'), false);
        ta.value = '';
        setMsg(msg, 'Sent.', true);
        (chat.msgs[c.id] = chat.msgs[c.id] || []).push(res.data);
        paintMessages(c.id);
        loadChats();
      });
  }

  function setChatStatus(c, s) {
    if (s === 'closed' && !confirm('Close this chat? If the guest writes again it reopens.')) return;
    db.from('chat_conversations').update({ status: s }).eq('id', c.id).select().single().then(function (res) {
      if (res.error || !res.data) { alert('Could not change the chat. ' + (res.error ? res.error.message : 'Not allowed.')); return; }
      patchChat(res.data);
      renderViews();
      renderChats(readDraft());
    });
  }

  function onChatEvent() { clearTimeout(chat.timer); chat.timer = setTimeout(loadChats, 400); }
  function startRealtime() {
    if (chat.channel) return;
    try {
      chat.channel = db.channel('owner-chats')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_messages' }, onChatEvent)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_conversations' }, onChatEvent)
        .subscribe();
    } catch (e) { /* the 20 second refresh below still works */ }
  }
  // fallback refresh in case realtime is not connected
  setInterval(function () { if (!document.hidden && state.me) loadChats(); }, 20000);

  // ------------------------------------------------------------- calendar ----
  // Shows reservations, active holds and blocked dates. Owners can add/release holds and block/unblock dates here.
  // Reservations are read only. Nothing here confirms a booking or messages a guest.
  var cal = { y: null, m: null, res: [], holds: [], blocks: [], names: {}, err: null, loaded: false, sel: null,
    props: [], propId: null, form: null, draft: {}, msg: null, busy: false };

  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function manilaToday() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Manila' }).format(new Date()); }
  function addDays(s, n) { var d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  // Postgres daterange text, e.g. [2026-12-01,2026-12-05). Returns {start, end} with end NOT included.
  function parseRange(raw) {
    var m = /^([\[(])([^,]*),([^\])]*)([\])])$/.exec(String(raw || '').replace(/"/g, ''));
    if (!m || !m[2] || !m[3]) return null;
    var lo = m[2], hi = m[3];
    if (m[1] === '(') lo = addDays(lo, 1);
    if (m[4] === ']') hi = addDays(hi, 1);
    return { start: lo, end: hi };
  }
  function pretty(s) { return String(s || '').replace(/_/g, ' '); }
  var fmtPeso = new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' });
  function peso(c) { return c == null ? 'not set' : fmtPeso.format(Number(c) / 100); }
  function toCentavos(s) { var n = Number(String(s).trim()); return String(s).trim() === '' || !isFinite(n) ? null : Math.round(n * 100); }

  function calItems() {
    var out = [];
    cal.res.forEach(function (r) {
      if (['cancelled', 'rejected', 'rebooked'].indexOf(r.status) >= 0) return;
      var rg = parseRange(r.stay) || { start: r.check_in, end: r.check_out };
      var cls = ['confirmed', 'checked_in', 'in_stay'].indexOf(r.status) >= 0 ? 'p-conf'
        : ['checked_out', 'completed'].indexOf(r.status) >= 0 ? 'p-done' : 'p-pend';
      out.push({ kind: 'Reservation', cls: cls, label: cal.names[r.guest_id] || r.reference || 'Reservation', start: rg.start, end: rg.end,
        sub: pretty(r.status) + (r.reference ? ' · ' + r.reference : '') + (r.guest_count ? ' · ' + r.guest_count + ' guest(s)' : '')
          + (r.total_centavos != null ? ' · total ' + peso(r.total_centavos) + ', downpayment ' + peso(r.downpayment_centavos) + (r.downpayment_due_on ? ' due ' + dateOnly(r.downpayment_due_on) : '') : ' · no amounts yet'),
        stay: true, type: 'reservation', id: r.id, status: r.status, total: r.total_centavos, down: r.downpayment_centavos, due: r.downpayment_due_on });
    });
    cal.holds.forEach(function (x) {
      if (x.status !== 'active') return;
      var rg = parseRange(x.period) || { start: x.check_in, end: x.check_out };
      out.push({ kind: 'Hold', cls: 'p-hold', label: x.label || 'Hold', start: rg.start, end: rg.end,
        sub: 'active hold' + (x.reason ? ' · ' + x.reason : '') + (x.remind_on ? ' · remind ' + dateOnly(x.remind_on) : ''), stay: true,
        type: 'hold', id: x.id, remind_on: x.remind_on });
    });
    cal.blocks.forEach(function (x) {
      if (x.released_at) return;
      var rg = parseRange(x.period) || { start: x.start_date, end: x.end_date };
      out.push({ kind: 'Blocked', cls: 'p-block', label: x.reason || 'Blocked', start: rg.start, end: rg.end, sub: 'blocked dates', stay: false, type: 'block', id: x.id });
    });
    return out.filter(function (i) { return i.start && i.end; });
  }

  function loadCal() {
    $('calView').replaceChildren(h('p', { class: 'small-print', text: 'Loading calendar...' }));
    Promise.all([
      db.from('reservations').select('*').order('check_in', { ascending: true }).limit(1000),
      db.from('availability_holds').select('*').order('check_in', { ascending: true }).limit(1000),
      db.from('blocked_dates').select('*').order('start_date', { ascending: true }).limit(1000),
      db.from('guests').select('id, full_name').limit(2000),
      db.from('properties').select('*')
    ]).then(function (res) {
      var errs = [];
      if (res[4].error) errs.push('properties: ' + res[4].error.message);
      cal.props = res[4].data || [];
      if (!cal.propId || !cal.props.some(function (p) { return p.id === cal.propId; })) cal.propId = cal.props.length ? cal.props[0].id : null;
      ['reservations', 'holds', 'blocked dates'].forEach(function (n, i) { if (res[i].error) errs.push(n + ': ' + res[i].error.message); });
      cal.err = errs.length ? errs.join(' | ') : null;
      cal.res = res[0].data || []; cal.holds = res[1].data || []; cal.blocks = res[2].data || [];
      cal.names = {};
      (res[3].data || []).forEach(function (g) { cal.names[g.id] = g.full_name; });
      if (cal.y === null) { var t = manilaToday().split('-'); cal.y = +t[0]; cal.m = +t[1] - 1; }
      cal.loaded = true;
      if (state.view === 'cal') renderCal();
    });
  }

  function shiftMonth(delta) {
    cal.m += delta;
    if (cal.m < 0) { cal.m = 11; cal.y--; } else if (cal.m > 11) { cal.m = 0; cal.y++; }
    cal.sel = null; renderCal();
  }


  // ---- add / release (all through database functions; the database checks the owner) ----
  function propName(p) { return p.name || p.title || p.slug || 'Property'; }
  function fld(label, input) { return h('div', { class: 'field' }, [h('label', { text: label }), input]); }
  function dIn(key, type, ph) {
    var el = h('input', { type: type, placeholder: ph || '' });
    el.value = cal.draft[key] || '';
    el.addEventListener('input', function () { cal.draft[key] = el.value; });
    return el;
  }
  function setMsgCal(t, good) { cal.msg = t ? { t: t, good: !!good } : null; }
  function openForm(kind) { cal.form = cal.form === kind ? null : kind; cal.draft = {}; setMsgCal(null); renderCal(); }
  function describeItems(items, sep) {
    return items.map(function (it) {
      var kind = it.kind === 'reservation' ? 'Reservation' : it.kind === 'hold' ? 'Hold' : 'Blocked';
      return kind + ' ' + (it.label || '') + ', ' + it.check_in + ' to ' + it.check_out + ' [' + it.status + ']';
    }).join(sep);
  }
  function calFail(t) { cal.busy = false; setMsgCal(t, false); renderCal(); }

  function submitForm() {
    if (cal.busy) return;
    var d = cal.draft, isHold = cal.form === 'hold';
    if (!cal.propId) return calFail('No property was found, so nothing was saved.');
    if (isHold && !(d.label || '').trim()) return calFail('Please say who the hold is for.');
    if (!isHold && !(d.reason || '').trim()) return calFail('Please give a reason for blocking.');
    if (!d.a || !d.b) return calFail('Please pick both dates.');
    var from = d.a, to = isHold ? d.b : addDays(d.b, 1);
    if (to <= from) return calFail(isHold ? 'Check-out must be after check-in.' : 'The last night must be on or after the first night.');
    cal.busy = true; setMsgCal('Checking the dates...', true); renderCal();
    db.rpc('check_availability', { p_property_id: cal.propId, p_check_in: from, p_check_out: to, p_exclude_reservation: null, p_exclude_inquiry: null })
      .then(function (res) {
        if (res.error) return calFail('Could not check the dates, so nothing was saved. ' + res.error.message);
        var items = res.data || [];
        var conflicts = items.filter(function (it) { return it.severity === 'conflict'; });
        if (conflicts.length) return calFail('These dates are not free, so nothing was saved: ' + describeItems(conflicts, '; '));
        if (items.length && !confirm('Heads up. These dates overlap with:\n\n' + describeItems(items, '\n') + '\n\nSave anyway?')) {
          cal.busy = false; setMsgCal('Nothing was saved.', true); return renderCal();
        }
        var call = isHold
          ? db.rpc('create_hold', { p_property_id: cal.propId, p_label: d.label.trim(), p_check_in: from, p_check_out: to, p_reason: (d.reason || '').trim() || null, p_remind_on: d.remind || null })
          : db.rpc('create_block', { p_property_id: cal.propId, p_start: from, p_end: to, p_reason: d.reason.trim() });
        call.then(function (r2) {
          if (r2.error) return calFail('Could not save. ' + r2.error.message);
          cal.busy = false; cal.form = null; cal.draft = {};
          setMsgCal(isHold ? 'Hold saved. The dates are now held, not booked.' : 'Dates blocked.', true);
          cal.sel = from;
          var t = from.split('-'); cal.y = +t[0]; cal.m = +t[1] - 1;
          loadCal();
        });
      });
  }

  function afterChange(res, okText) {
    if (res.error) return calFail('Could not do that. ' + res.error.message);
    cal.busy = false; setMsgCal(okText, true); loadCal();
  }
  function doRelease(i) {
    if (cal.busy) return;
    var note = prompt('Release the hold for "' + i.label + '"? The dates become free again.\nAdd a short note (optional), then press OK.', '');
    if (note === null) return;
    cal.busy = true;
    db.rpc('release_hold', { p_hold_id: i.id, p_note: note.trim() || null }).then(function (res) { afterChange(res, 'Hold released.'); });
  }
  function doExtend(i, val) {
    if (cal.busy) return;
    if (!val) return calFail('Please pick a new reminder date.');
    cal.busy = true;
    db.rpc('extend_hold', { p_hold_id: i.id, p_new_remind_on: val, p_note: null }).then(function (res) { afterChange(res, 'Reminder date changed. The hold is still active.'); });
  }
  function doUnblock(i) {
    if (cal.busy) return;
    if (!confirm('Unblock these dates (' + i.label + ')? They become free again.')) return;
    cal.busy = true;
    db.rpc('release_blocked_dates', { p_block_id: i.id }).then(function (res) { afterChange(res, 'Dates unblocked.'); });
  }

  // ---- reservation steps (database function checks the owner and the allowed moves) ----
  function doQuote(i, totalVal, downVal, dueVal) {
    if (cal.busy) return;
    var total = toCentavos(totalVal), down = toCentavos(downVal);
    if (total === null || total <= 0) return calFail('Please type the total amount in pesos.');
    if (down === null || down < 0) return calFail('Please type the downpayment amount in pesos (0 if none).');
    if (down > total) return calFail('The downpayment cannot be more than the total.');
    cal.busy = true;
    db.rpc('set_reservation_quote', { p_reservation_id: i.id, p_total_centavos: total, p_downpayment_centavos: down, p_due_on: dueVal || null })
      .then(function (res) { afterChange(res, 'Quotation amounts saved. Nothing was sent to the guest.'); });
  }
  function doStatus(i, newStatus, askText, okText, needAmounts) {
    if (cal.busy) return;
    if (needAmounts && (i.total == null || i.down == null)) return calFail('Save the quotation amounts first.');
    var note = prompt(askText + '\nAdd a short note (optional), then press OK.', '');
    if (note === null) return;
    cal.busy = true;
    db.rpc('set_reservation_status', { p_reservation_id: i.id, p_new_status: newStatus, p_note: note.trim() || null, p_allow_warnings: false })
      .then(function (res) { afterChange(res, okText); });
  }

  function calFormEl() {
    var isHold = cal.form === 'hold';
    var kids = [h('h3', { text: isHold ? 'Hold dates' : 'Block dates' })];
    if (cal.props.length > 1) {
      var ps = h('select', null, cal.props.map(function (p) { var o = h('option', { value: p.id, text: propName(p) }); if (p.id === cal.propId) o.selected = true; return o; }));
      ps.addEventListener('change', function () { cal.propId = ps.value; });
      kids.push(fld('Property', ps));
    }
    if (isHold) {
      kids.push(fld('Who is it for?', dIn('label', 'text', 'Guest name')), fld('Check-in', dIn('a', 'date')), fld('Check-out', dIn('b', 'date')),
        fld('Reason (optional)', dIn('reason', 'text')), fld('Remind us on (optional)', dIn('remind', 'date')));
    } else {
      kids.push(fld('First blocked night', dIn('a', 'date')), fld('Last blocked night', dIn('b', 'date')),
        fld('Reason', dIn('reason', 'text', 'e.g. owners staying, repairs')));
    }
    kids.push(h('div', { class: 'actions' }, [
      h('button', { class: 'btn small', type: 'button', text: isHold ? 'Save hold' : 'Block dates', onclick: submitForm }),
      h('button', { class: 'btn ghost small', type: 'button', text: 'Cancel', onclick: function () { cal.form = null; cal.draft = {}; setMsgCal(null); renderCal(); } })
    ]));
    kids.push(h('p', { class: 'small-print', text: isHold
      ? 'A hold keeps the dates for someone for now. It is not a booking and nothing is sent to the guest. It never releases by itself: you release it.'
      : 'Blocked nights cannot be booked. The check-out day after the last blocked night stays free.' }));
    return h('div', { class: 'card', style: 'padding:1rem 1.1rem;' }, kids);
  }

  function itemActions(i) {
    if (i.type === 'hold') {
      var rd = h('input', { type: 'date', style: 'max-width:11rem;' });
      if (i.remind_on) rd.value = i.remind_on;
      return h('div', { class: 'actions', style: 'margin-top:.4rem;' }, [
        h('button', { class: 'btn small', type: 'button', text: 'Release hold', onclick: function () { doRelease(i); } }),
        rd,
        h('button', { class: 'btn ghost small', type: 'button', text: 'Change reminder date', onclick: function () { doExtend(i, rd.value); } })
      ]);
    }
    if (i.type === 'block') {
      return h('div', { class: 'actions', style: 'margin-top:.4rem;' }, [
        h('button', { class: 'btn small', type: 'button', text: 'Unblock', onclick: function () { doUnblock(i); } })
      ]);
    }
    if (i.type === 'reservation') {
      var st = i.status, kids = [];
      var canQuote = st === 'quotation_prepared' || st === 'quotation_sent';
      if (canQuote) {
        var tot = h('input', { type: 'number', min: '0', step: '0.01', placeholder: 'Total (PHP)', style: 'max-width:9rem;' });
        var dn = h('input', { type: 'number', min: '0', step: '0.01', placeholder: 'Downpayment (PHP)', style: 'max-width:10rem;' });
        var due = h('input', { type: 'date', style: 'max-width:11rem;' });
        if (i.total != null) tot.value = String(i.total / 100);
        if (i.down != null) dn.value = String(i.down / 100);
        if (i.due) due.value = i.due;
        kids.push(h('div', { class: 'small-print', text: 'You type the amounts yourself. Total, downpayment, and the date the downpayment is due (optional).' }));
        kids.push(h('div', { class: 'actions', style: 'margin-top:.3rem;' }, [tot, dn, due,
          h('button', { class: 'btn ghost small', type: 'button', text: 'Save quotation amounts', onclick: function () { doQuote(i, tot.value, dn.value, due.value); } })]));
      }
      var acts = [];
      if (st === 'quotation_prepared') acts.push(h('button', { class: 'btn small', type: 'button', text: 'Mark quotation as sent',
        onclick: function () { doStatus(i, 'quotation_sent', 'Mark the quotation as sent? Only press this after you have actually sent it to the guest yourself.', 'Marked as sent. The app did not send anything.', true); } }));
      if (st === 'quotation_sent') {
        acts.push(h('button', { class: 'btn small', type: 'button', text: 'Guest agreed: wait for downpayment',
          onclick: function () { doStatus(i, 'awaiting_downpayment', 'The guest agreed to the quotation and now owes the downpayment?', 'Now waiting for the downpayment. The dates are still not blocked.', true); } }));
        acts.push(h('button', { class: 'btn ghost small', type: 'button', text: 'Back to draft',
          onclick: function () { doStatus(i, 'quotation_prepared', 'Move this back to a draft?', 'Moved back to a draft.', false); } }));
      }
      if (['quotation_prepared', 'quotation_sent', 'awaiting_downpayment'].indexOf(st) >= 0) acts.push(h('button', { class: 'btn ghost small', type: 'button', text: 'Cancel reservation',
        onclick: function () { if (confirm('Cancel this reservation? It disappears from the calendar.')) doStatus(i, 'cancelled', 'Cancelling this reservation.', 'Reservation cancelled.', false); } }));
      if (acts.length) kids.push(h('div', { class: 'actions', style: 'margin-top:.4rem;' }, acts));
      if (st === 'awaiting_downpayment') kids.push(h('div', { class: 'small-print', text: 'Payments and confirming a booking are not in the app yet.' }));
      return kids.length ? h('div', null, kids) : null;
    }
    return null;
  }

  function renderCal() {
    var box = $('calView');
    var items = calItems();
    var today = manilaToday();
    var monthName = new Date(Date.UTC(cal.y, cal.m, 1)).toLocaleString('en-PH', { month: 'long', year: 'numeric', timeZone: 'UTC' });
    var head = h('div', { class: 'cal-head' }, [
      h('button', { class: 'btn ghost small', type: 'button', text: 'Previous', onclick: function () { shiftMonth(-1); } }),
      h('h3', { text: monthName }),
      h('button', { class: 'btn ghost small', type: 'button', text: 'Today', onclick: function () { var t = today.split('-'); cal.y = +t[0]; cal.m = +t[1] - 1; cal.sel = today; renderCal(); } }),
      h('button', { class: 'btn ghost small', type: 'button', text: 'Next', onclick: function () { shiftMonth(1); } })
    ]);
    var grid = h('div', { class: 'cal-grid' });
    ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(function (d) { grid.appendChild(h('div', { class: 'cal-dow', text: d })); });
    var lead = new Date(Date.UTC(cal.y, cal.m, 1)).getUTCDay();
    var days = new Date(Date.UTC(cal.y, cal.m + 1, 0)).getUTCDate();
    for (var b = 0; b < lead; b++) grid.appendChild(h('div', { class: 'cal-cell blank' }));
    for (var d = 1; d <= days; d++) {
      (function (day) {
        var ds = cal.y + '-' + pad2(cal.m + 1) + '-' + pad2(day);
        var here = items.filter(function (i) { return i.start <= ds && ds < i.end; });
        var cell = h('button', { class: 'cal-cell' + (ds === today ? ' today' : '') + (ds === cal.sel ? ' sel' : ''), type: 'button',
          onclick: function () { cal.sel = ds; renderCal(); } }, [h('span', { class: 'dn', text: String(day) })]);
        here.slice(0, 3).forEach(function (i) { cell.appendChild(h('span', { class: 'pill ' + i.cls, text: i.label })); });
        if (here.length > 3) cell.appendChild(h('span', { class: 'cal-more', text: '+' + (here.length - 3) + ' more' }));
        grid.appendChild(cell);
      })(d);
    }
    var legend = h('div', { class: 'legend' }, [
      h('span', { class: 'pill p-conf', text: 'Confirmed / staying' }), h('span', { class: 'pill p-pend', text: 'Pending' }),
      h('span', { class: 'pill p-hold', text: 'Hold' }), h('span', { class: 'pill p-block', text: 'Blocked' }), h('span', { class: 'pill p-done', text: 'Finished' })
    ]);
    var kids = [head];
    if (cal.msg) kids.push(h('p', { class: cal.msg.good ? 'ok' : 'err', text: cal.msg.t }));
    kids.push(h('div', { class: 'actions', style: 'margin-bottom:.75rem;' }, [
      h('button', { class: 'btn small', type: 'button', text: 'Hold dates', onclick: function () { openForm('hold'); } }),
      h('button', { class: 'btn ghost small', type: 'button', text: 'Block dates', onclick: function () { openForm('block'); } })
    ]));
    if (cal.form) kids.push(calFormEl());
    if (cal.err) kids.push(h('p', { class: 'err', text: 'Some data could not be loaded. ' + cal.err }));
    kids.push(grid, legend);
    if (cal.sel) {
      var sel = cal.sel;
      var list = items.filter(function (i) { return i.start <= sel && sel < i.end; });
      var panel = h('div', { class: 'card', style: 'padding:1rem 1.1rem;' }, [h('h3', { text: dateOnly(sel) })]);
      if (!list.length) panel.appendChild(h('p', { class: 'small-print', text: 'Nothing booked, held or blocked on this night.' }));
      list.forEach(function (i) {
        var span = i.stay ? 'Check-in ' + dateOnly(i.start) + ', check-out ' + dateOnly(i.end) : 'Blocked ' + dateOnly(i.start) + ' to ' + dateOnly(addDays(i.end, -1));
        panel.appendChild(h('div', { class: 'day-item' }, [
          h('span', { class: 'pill ' + i.cls, text: i.kind }),
          h('div', null, [h('strong', { text: i.label }), h('div', { class: 'small-print', text: span }), h('div', { class: 'small-print', text: i.sub }), itemActions(i)])
        ]));
      });
      kids.push(panel);
    }
    kids.push(h('p', { class: 'small-print', text: 'A booked night is the night you stay: the check-out day stays free for the next guest. Reservations move forward only when you press a button. Holds and blocks are changed only when you press a button, and nothing is sent to guests.' }));
    box.replaceChildren.apply(box, kids);
  }

  $('search').addEventListener('input', function (e) { state.q = e.target.value.trim().toLowerCase(); render(readOpenNotes()); });

  // refresh by itself every 2 minutes, but never while someone has a card open
  setInterval(function () { if (!document.hidden && state.me && !state.openId) load(); }, 120000);

  db.auth.getSession().then(function (r) { if (r.data && r.data.session) start(); });
})();
</script>
</body>
</html>
